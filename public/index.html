  /* ---------------- render: WALL LIBRARY ---------------- */
  function canDeleteWall(w){
    if (storageMode !== "http") return true;                 // your device, your rules
    if (!w.author) return true;                              // unattributed
    return !!(player.name && w.author.toLowerCase() === player.name.toLowerCase());
  }

  function renderLibrary(){
    var heading = storageMode === "http" ? "Wall library" : "My walls";
    var note = writable === false
      ? '<div class="sync-note"><span class="sync-dot local"></span>Saved on this device only</div>'
      : storageMode === "http"
        ? '<div class="sync-note"><span class="sync-dot"></span>Every player\u2019s walls, visible to everyone. You can delete only your own.</div>'
        : isShared()
          ? '<div class="sync-note"><span class="sync-dot"></span>Shared — anyone with this page’s link sees these too</div>'
          : '<div class="sync-note"><span class="sync-dot local"></span>Saved on this device</div>';
    if (!library.length){
      return (
        '<div class="view-header"><h2>' + heading + '</h2></div>' +
        note +
        '<div class="card empty-state">No walls yet. Build one, or save a random wall you like from the results screen' +
        (storageMode === "http" ? ' \u2014 it\u2019ll appear here for everyone' : '') + '.</div>'
      );
    }
    var rows = library.slice().reverse().map(function(w){
      var chips = w.groups.map(function(g){
        return '<span class="chip" style="background:var(--' + g.color + '-tint); color:var(--' + g.color + ')"><span class="dot" style="background:var(--' + g.color + ')"></span>' + esc(g.label) + '</span>';
      }).join("");
      var byline = "";
      if (storageMode === "http"){
        var who = w.author ? "by " + esc(w.author) : "anonymous";
        var playedBit = w.plays ? " \u00b7 solved " + (w.solves || 0) + "/" + w.plays : " \u00b7 unplayed";
        byline = '<div class="wall-byline">' + who + playedBit + (w.difficulty ? " \u00b7 " + esc(w.difficulty) : "") + '</div>';
      }
      return (
        '<div class="card wall-card">' +
          '<div class="info"><h4>' + esc(w.title) + '</h4>' + byline + '<div class="chip-row">' + chips + '</div></div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-primary btn-small" data-action="play-wall" data-id="' + w.id + '">Play</button>' +
            '<button class="btn btn-ghost btn-small" data-action="share-saved" data-id="' + w.id + '">Share</button>' +
            (canDeleteWall(w) ? '<button class="btn btn-danger btn-small" data-action="delete-wall" data-id="' + w.id + '">Delete</button>' : '') +
          '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="view-header"><h2>' + heading + '</h2></div>' + note + '<div class="wall-list">' + rows + '</div>';
  }

  /* ---------------- WORD CHAIN gameplay ---------------- */
  var chainState = null;

  function startChain(words, opts){
    opts = opts || {};
    if (chainState && chainState.timerId) clearInterval(chainState.timerId);
    var isCountdown = timerMode !== "none" && timerMode !== "stopwatch";
    var slots = [words[0], null, null, null, null, words[5]];
    chainState = {
      words: words, custom: !!opts.custom, title: opts.title || "Word Chain",
      slots: slots,
      locked: [true, false, false, false, false, true],
      tray: shuffle(words.slice(1, 5)),
      mistakes: 0, hintsUsed: 0, finished: false, won: false, endReason: null,
      startedAt: Date.now(), elapsed: 0,
      timerMode: isCountdown ? "countdown" : timerMode,
      timeLimit: isCountdown ? parseInt(timerMode, 10) : null,
      timerId: null
    };
    view = "chain";
    render();
    chainState.timerId = setInterval(function(){
      if (!chainState || chainState.finished) return;
      chainState.elapsed = Math.floor((Date.now() - chainState.startedAt) / 1000);
      var el = document.getElementById("chain-timer");
      if (chainState.timerMode === "countdown"){
        var remain = chainState.timeLimit - chainState.elapsed;
        if (remain <= 0){ chainState.elapsed = chainState.timeLimit; finishChain(false, "time"); return; }
        if (el){ el.textContent = formatTime(remain); el.classList.toggle("timer-low", remain <= 30); }
      } else if (chainState.timerMode === "stopwatch" && el){
        el.textContent = formatTime(chainState.elapsed);
      }
    }, 1000);
  }

  function chainAdjOk(i){
    var s = chainState;
    if (s.custom) return s.slots[i] === s.words[i];
    return chainLink(s.slots[i - 1], s.slots[i]);
  }

  function checkChain(){
    var s = chainState;
    var fail = -1;
    for (var i = 1; i < 6; i++){
      if (!s.custom && !chainLink(s.slots[i - 1], s.slots[i])){ fail = i; break; }
      if (s.custom && i < 5 && s.slots[i] !== s.words[i]){ fail = i; break; }
    }
    if (fail === -1){ finishChain(true); return; }
    /* everything before the first broken link is confirmed; the rest goes back */
    for (var j = 1; j < fail; j++) s.locked[j] = true;
    for (var k = fail; k < 5; k++){
      if (!s.locked[k] && s.slots[k]){ s.tray.push(s.slots[k]); s.slots[k] = null; }
    }
    s.mistakes++;
    if (s.mistakes >= MAX_MISTAKES){ finishChain(false, "mistakes"); return; }
    renderChainBody(true);
  }

  function placeChainWord(trayIdx){
    var s = chainState;
    if (!s || s.finished) return;
    var word = s.tray[trayIdx];
    if (!word) return;
    for (var i = 1; i < 5; i++){
      if (!s.slots[i]){
        s.slots[i] = word;
        s.tray.splice(trayIdx, 1);
        break;
      }
    }
    if (s.tray.length === 0){ setTimeout(checkChain, 250); }
    renderChainBody();
  }

  function unplaceChainWord(slotIdx){
    var s = chainState;
    if (!s || s.finished || s.locked[slotIdx] || !s.slots[slotIdx]) return;
    s.tray.push(s.slots[slotIdx]);
    s.slots[slotIdx] = null;
    renderChainBody();
  }

  function chainHint(){
    var s = chainState;
    if (!s || s.finished) return;
    var e = -1;
    for (var i = 1; i < 5; i++){ if (!s.slots[i]){ e = i; break; } }
    if (e === -1) return;
    var pick = -1;
    if (s.custom){
      pick = s.tray.indexOf(s.words[e]);
    } else {
      for (var t = 0; t < s.tray.length; t++){
        if (!chainLink(s.slots[e - 1], s.tray[t])) continue;
        var rest = s.tray.slice(0, t).concat(s.tray.slice(t + 1));
        if (chainCompletable(s.tray[t], rest, s.slots[5])){ pick = t; break; }
      }
    }
    if (pick === -1) return;
    s.hintsUsed++; s.mistakes++;
    s.slots[e] = s.tray[pick];
    s.locked[e] = true;
    s.tray.splice(pick, 1);
    toast('Hint: "' + s.slots[e].toUpperCase() + '" goes next — costs a guess', 2600);
    if (s.mistakes >= MAX_MISTAKES && s.tray.length){ finishChain(false, "mistakes"); return; }
    if (s.tray.length === 0){ setTimeout(checkChain, 250); }
    renderChainBody();
  }

  function chainScore(){
    if (!chainState.won) return 0;
    var t = chainState.timerMode === "none" ? 0 : chainState.elapsed * 3;
    return Math.max(0, 1000 - chainState.mistakes * 150 - t);
  }

  function finishChain(won, reason){
    var s = chainState;
    s.finished = true; s.won = won; s.endReason = won ? "won" : (reason || "mistakes");
    clearInterval(s.timerId);
    if (!won){ s.slots = s.words.slice(); s.locked = [true,true,true,true,true,true]; }
    submitModeResult({ won: won, mistakes: s.mistakes, hints: s.hintsUsed, timeS: s.elapsed, score: chainScore() });
    render();
  }

  /* ---------------- SEQUENCES gameplay ---------------- */
  var seqState = null;

  function startSeqRound(list, opts){
    opts = opts || {};
    if (seqState && seqState.timerId) clearInterval(seqState.timerId);
    var isCountdown = timerMode !== "none" && timerMode !== "stopwatch";
    seqState = {
      list: list.map(function(q){
        return { label: q.label, seq: q.seq, options: shuffle([q.seq[3]].concat(q.decoys)) };
      }),
      single: !!opts.single,
      idx: 0, correct: 0, earned: 0, mistakes: 0, hintsUsed: 0,
      attempts: 0, phase: "ask", wrongPicks: [],
      finished: false, won: false, endReason: null,
      startedAt: Date.now(), elapsed: 0,
      timerMode: isCountdown ? "countdown" : timerMode,
      timeLimit: isCountdown ? parseInt(timerMode, 10) : null,
      timerId: null
    };
    view = "seq";
    render();
    seqState.timerId = setInterval(function(){
      if (!seqState || seqState.finished) return;
      seqState.elapsed = Math.floor((Date.now() - seqState.startedAt) / 1000);
      var el = document.getElementById("seq-timer");
      if (seqState.timerMode === "countdown"){
        var remain = seqState.timeLimit - seqState.elapsed;
        if (remain <= 0){ seqState.elapsed = seqState.timeLimit; finishSeq("time"); return; }
        if (el){ el.textContent = formatTime(remain); el.classList.toggle("timer-low", remain <= 30); }
      } else if (seqState.timerMode === "stopwatch" && el){
        el.textContent = formatTime(seqState.elapsed);
      }
    }, 1000);
  }

  function seqAnswer(optIdx){
    var s = seqState;
    if (!s || s.finished || s.phase !== "ask") return;
    var q = s.list[s.idx];
    var pickText = q.options[optIdx];
    if (pickText === q.seq[3]){
      s.earned += (s.attempts === 0 ? 200 : 100);
      s.correct++;
      s.phase = "reveal";
      renderSeqBody();
      setTimeout(seqAdvance, 1200);
    } else {
      s.mistakes++;
      s.attempts++;
      s.wrongPicks.push(optIdx);
      if (s.attempts >= 2){
        s.phase = "reveal";
        renderSeqBody();
        setTimeout(seqAdvance, 1600);
      } else {
        renderSeqBody(true);
      }
    }
  }

  function seqAdvance(){
    var s = seqState;
    if (!s || s.finished) return;
    s.idx++; s.attempts = 0; s.phase = "ask"; s.wrongPicks = [];
    if (s.idx >= s.list.length){ finishSeq(); return; }
    renderSeqBody();
  }

  function finishSeq(reason){
    var s = seqState;
    s.finished = true;
    s.won = s.correct >= (s.single ? 1 : 3);
    s.endReason = reason || "done";
    clearInterval(s.timerId);
    submitModeResult({ won: s.won, mistakes: s.mistakes, hints: 0, timeS: s.elapsed, score: s.earned });
    render();
  }

  /* shared: points/streak plumbing for the non-wall modes */
  function submitModeResult(rec){
    rec = { name: player.name, daily: null, won: !!rec.won, mistakes: rec.mistakes || 0,
            hints: rec.hints || 0, timeS: rec.timeS || 0, score: rec.score || 0 };
    applyResultLocally(rec);
    if (storageMode === "http" && player.name){
      apiPost("/api/result", rec).then(function(res){
        if (res && res.player){
          var nm = player.name, flag = player.lastDailyPlayed;
          player = res.player; player.name = nm; player.lastDailyPlayed = flag;
          saveLocalPlayer();
          var el = document.getElementById("points-readout");
          if (el) el.textContent = player.points;
        }
        leaderboardAt = 0;
      }).catch(function(){});
    }
  }

  /* ---------------- share codecs for chains & sequences ---------------- */
  function encodePayload(obj){
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decodePayload(code){
    var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }
  function chainShareUrl(){
    var s = chainState;
    return location.origin + location.pathname + "#c=" +
      encodePayload({ t: s.title, w: s.words });
  }
  function seqShareUrl(q){
    return location.origin + location.pathname + "#q=" +
      encodePayload({ l: q.label, s: q.seq, d: q.decoys });
  }

  /* ---------------- result snippet ---------------- */
  var COLOR_EMOJI = { sage:"\ud83d\udfe9", gold:"\ud83d\udfe8", slate:"\ud83d\udfe6", brick:"\ud83d\udfe5" };

  function resultSnippet(){
    var w = play.wall;
    var squares = play.solvedOrder.map(function(gi){
      return COLOR_EMOJI[w.groups[gi].color] || "\u2b1c";
    }).join("");
    for (var i = play.solvedOrder.length; i < 4; i++) squares += "\u2b1b";
    var head = w.daily ? ("Connecting Wall \u2014 Daily " + w.daily)
                       : ("Connecting Wall \u2014 " + (w.difficulty || "Custom") + ": " + w.title);
    var line = play.won
      ? (squares + "  " + formatTime(play.elapsed) + " \u00b7 " + play.mistakes + " wrong \u00b7 " + scoreFor() + " pts")
      : (squares + "  beaten \u2014 " + play.solvedOrder.length + "/4 found");
    var url = w.daily ? (location.origin + location.pathname)
                      : shareUrlFor(w);
    return head + "\n" + line + "\n" + url;
  }

  function copyText(text, okMsg){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }).catch(function(){ toast("Couldn't copy \u2014 long-press to select"); });
    } else {
      toast("Couldn't copy \u2014 long-press to select");
    }
  }

  /* ---------------- modal ---------------- */
  function showShareModal(wall){
    var url = shareUrlFor(wall);
    var wrap = document.createElement("div");
    wrap.className = "overlay";
    wrap.id = "share-overlay";
    wrap.innerHTML =
      '<div class="modal">' +
        '<h3>Share &ldquo;' + esc(wall.title) + '&rdquo;</h3>' +
        '<p>Anyone who opens this link plays this exact wall.</p>' +
        '<input type="text" id="share-link-field" value="' + esc(url) + '" readonly>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
          '<button class="btn btn-primary" data-action="copy-link">Copy link</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var field = document.getElementById("share-link-field");
    field.focus();
    field.select();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast("Link copied"); }).catch(function(){});
    }
  }
  function closeModal(){
    var m = document.getElementById("share-overlay");
    if (m) m.remove();
  }

  /* ---------------- shell / topbar ---------------- */
  function shellHtml(activeView, inner){
    function pill(v, text){
      return '<button class="pill" data-action="go-' + v + '" aria-current="' + (activeView === v) + '">' + text + '</button>';
    }
    return (
      '<div class="shell">' +
        '<div class="topbar">' +
          '<div class="wordmark" data-action="go-home" role="button" tabindex="0" aria-label="Connecting Wall home">' +
            '<span class="brick-icon" aria-hidden="true">&#129530;</span>' +
            '<h1>Connecting Wall</h1>' +
            '<span class="tag">build &middot; share &middot; solve</span>' +
          '</div>' +
          '<nav class="pills">' + pill("home", "Home") + pill("build", "Build") + pill("library", "My Walls") + pill("learned", "Learning") + '</nav>' +
        '</div>' +
        '<div id="view-slot">' + inner + '</div>' +
      '</div>'
    );
  }

  /* ---------------- main render dispatcher ---------------- */
  function render(){
    var root = app();
    var inner = "";
    if (view === "home") inner = renderHome();
    else if (view === "build") inner = renderBuild();
    else if (view === "library") inner = renderLibrary();
    else if (view === "learned") inner = renderLearned();
    else if (view === "chain") inner = renderChain();
    else if (view === "seq") inner = renderSeq();
    else if (view === "play") inner = renderPlay();
    root.innerHTML = shellHtml(view, inner);
    if (view === "play") renderPlayBody();
    if (view === "chain") renderChainBody();
    if (view === "seq") renderSeqBody();
  }

  /* ---------------- event delegation ---------------- */
  document.addEventListener("click", function(e){
    var tile = e.target.closest(".tile");
    if (tile && view === "play" && play && !play.finished){
      toggleTile(parseInt(tile.getAttribute("data-idx"), 10));
      return;
    }
    var trayCard = e.target.closest("[data-chain-tray]");
    if (trayCard && view === "chain"){ placeChainWord(parseInt(trayCard.getAttribute("data-chain-tray"), 10)); return; }
    var chainSlot = e.target.closest("[data-chain-slot]");
    if (chainSlot && view === "chain"){ unplaceChainWord(parseInt(chainSlot.getAttribute("data-chain-slot"), 10)); return; }
    var seqOpt = e.target.closest("[data-seq-opt]");
    if (seqOpt && view === "seq"){ seqAnswer(parseInt(seqOpt.getAttribute("data-seq-opt"), 10)); return; }

    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");

    if (action === "play-random"){
      currentWall = generateWall(t.getAttribute("data-diff") || "mixed");
      startPlay(currentWall);
    } else if (action === "play-daily"){
      currentWall = generateDailyWall();
      startPlay(currentWall);
    } else if (action === "play-chain"){
      startChain(generateChain());
    } else if (action === "play-seq"){
      startSeqRound(shuffle(SEQ_BANK).slice(0, 5));
    } else if (action === "chain-hint"){
      chainHint();
    } else if (action === "chain-give-up"){
      finishChain(false, "gaveup");
    } else if (action === "copy-chain-result"){
      var cs = chainState;
      var chead = "Connecting Wall \u2014 Word Chain" + (cs.custom ? ': "' + cs.title + '"' : "");
      var cline = cs.won ? ("\ud83d\udd17 solved in " + formatTime(cs.elapsed) + " \u00b7 " + cs.mistakes + " wrong \u00b7 " + chainScore() + " pts")
                         : "\ud83d\udd17 chain broke me";
      copyText(chead + "\n" + cline + "\n" + chainShareUrl(), "Result copied — paste it anywhere");
    } else if (action === "copy-chain-link"){
      copyText(chainShareUrl(), "Chain link copied — anyone can play it");
    } else if (action === "copy-seq-result"){
      var ss = seqState;
      var qhead = "Connecting Wall \u2014 Sequences";
      var qline = "\u25b6 " + ss.correct + "/" + ss.list.length + " \u00b7 " + ss.earned + " pts \u00b7 " + formatTime(ss.elapsed);
      var qurl = ss.single ? seqShareUrl({ label: ss.list[0].label, seq: ss.list[0].seq, decoys: ss.list[0].options.filter(function(o){ return o !== ss.list[0].seq[3]; }) })
                           : (location.origin + location.pathname);
      copyText(qhead + "\n" + qline + "\n" + qurl, "Result copied — paste it anywhere");
    } else if (action === "copy-seq-link"){
      var sq = seqState.list[0];
      copyText(seqShareUrl({ label: sq.label, seq: sq.seq, decoys: sq.options.filter(function(o){ return o !== sq.seq[3]; }) }), "Sequence link copied");
    } else if (action === "build-kind"){
      syncDraftFromDom();
      buildKind = t.getAttribute("data-kind");
      go("build");
    } else if (action === "preview-chain"){
      var cw = [];
      for (var ci = 0; ci < 6; ci++){
        var inp = document.getElementById("chain-word-" + ci);
        cw.push(((inp && inp.value) || "").trim());
      }
      chainDraft = cw.slice();
      var ctitle = (document.getElementById("chain-title") || {}).value || "";
      chainDraftTitle = ctitle;
      if (cw.some(function(w){ return !w; })){ toast("Fill in all six words, in order"); return; }
      var lower = cw.map(function(w){ return w.toLowerCase(); });
      if (new Set ? new Set(lower).size !== 6 : false){ toast("All six words must be different"); return; }
      startChain(cw, { custom: true, title: ctitle.trim() || "Custom Chain" });
    } else if (action === "preview-seq"){
      var ql = ((document.getElementById("seq-label") || {}).value || "").trim();
      var qs = [], qd = [];
      for (var qi = 0; qi < 4; qi++) qs.push(((document.getElementById("seq-item-" + qi) || {}).value || "").trim());
      for (var di = 0; di < 3; di++) qd.push(((document.getElementById("seq-decoy-" + di) || {}).value || "").trim());
      seqDraft = { label: ql, seq: qs.slice(), decoys: qd.slice() };
      if (!ql){ toast("Name the sequence — that's the answer they're guessing"); return; }
      if (qs.some(function(w){ return !w; }) || qd.some(function(w){ return !w; })){ toast("Fill in all four steps and all three decoys"); return; }
      if (qd.some(function(d){ return d.toLowerCase() === qs[3].toLowerCase(); })){ toast("A decoy matches the real answer"); return; }
      startSeqRound([{ label: ql, seq: qs, decoys: qd }], { single: true });
    } else if (action === "copy-result"){
      copyText(resultSnippet(), "Result copied — paste it anywhere");
    } else if (action === "save-name" || action === "change-name"){
      if (action === "change-name"){
        player.name = null;
        render();
        var inp0 = document.getElementById("player-name-input");
        if (inp0) inp0.focus();
        return;
      }
      var inp = document.getElementById("player-name-input");
      var raw = (inp ? inp.value : "").trim();
      if (raw.length < 2){ toast("Names need at least 2 characters"); return; }
      if (!/^[A-Za-z0-9 _-]{2,20}$/.test(raw)){ toast("Letters, numbers, spaces, - and _ only"); return; }
      player.name = raw;
      saveLocalPlayer();
      syncPlayer();
      render();
    } else if (action === "go-build"){
      draftGroups = emptyDraftGroups();
      draftTitle = "";
      go("build");
    } else if (action === "go-library"){
      go("library");
    } else if (action === "set-timer"){
      timerMode = t.getAttribute("data-mode");
      try { localStorage.setItem("cw_timer_mode", timerMode); } catch (e){}
      go("home");
    } else if (action === "go-home"){
      go("home");
      maybeFlushStats();
    } else if (action === "go-learned"){
      go("learned");
    } else if (action === "open-code"){
      var input = document.getElementById("code-input");
      openCodeInput(input ? input.value : "");
    } else if (action === "fill-example"){
      syncDraftFromDom();
      draftGroups = TIER_COLORS.map(function(_, tier){
        var pool = categoriesByTier(tier);
        var c = pool[Math.floor(Math.random() * pool.length)];
        return { label: c.label, items: c.items.slice() };
      });
      go("build");
    } else if (action === "fill-row"){
      syncDraftFromDom();
      var rowIdx = parseInt(t.getAttribute("data-row"), 10);
      var rowPool = categoriesByTier(rowIdx);
      var picked = rowPool[Math.floor(Math.random() * rowPool.length)];
      draftGroups[rowIdx] = { label: picked.label, items: picked.items.slice() };
      go("build");
    } else if (action === "clear-build"){
      draftGroups = emptyDraftGroups();
      draftTitle = "";
      go("build");
    } else if (action === "preview-build"){
      var draft = readBuildForm();
      clearFieldErrors();
      var v = validateBuild(draft);
      if (v.errors.length){
        v.errors.forEach(function(er){ var n = $(er.sel); if (n) n.classList.add("field-error"); });
        toast("Fill in every field — sixteen items, four connections");
        return;
      }
      if (v.dupes){
        toast("Every item needs to be different");
        return;
      }
      var wall = {
        id: uid(),
        title: draft.title || "Untitled Wall",
        groups: draft.groups.map(function(g, gi){ return { label: g.label, color: TIER_COLORS[gi], tier: gi, items: g.items }; })
      };
      currentWall = wall;
      startPlay(wall);
    } else if (action === "shuffle-tiles"){
      play.pool = shuffle(play.pool);
      renderPlayBody();
    } else if (action === "deselect-tiles"){
      play.selected = [];
      renderPlayBody();
    } else if (action === "give-up"){
      finishPlay(false, "gaveup");
    } else if (action === "use-hint"){
      useHint();
    } else if (action === "save-wall"){
      addToLibrary(currentWall);
    } else if (action === "share-wall"){
      showShareModal(currentWall);
    } else if (action === "share-saved"){
      var id = t.getAttribute("data-id");
      var w = library.filter(function(x){ return x.id === id; })[0];
      if (w) showShareModal(w);
    } else if (action === "play-wall"){
      var id2 = t.getAttribute("data-id");
      var w2 = library.filter(function(x){ return x.id === id2; })[0];
      if (w2){ currentWall = w2; startPlay(w2); }
    } else if (action === "delete-wall"){
      var id3 = t.getAttribute("data-id");
      removeFromLibrary(id3);
    } else if (action === "close-modal"){
      closeModal();
    } else if (action === "copy-link"){
      var field = document.getElementById("share-link-field");
      if (field){
        field.select();
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(field.value).then(function(){ toast("Link copied"); }).catch(function(){
            document.execCommand && document.execCommand("copy");
            toast("Link copied");
          });
        } else {
          try { document.execCommand("copy"); toast("Link copied"); } catch (e){ toast("Select the link and copy it"); }
        }
      }
    }
  });

  document.addEventListener("input", function(e){
    if (view === "build" && e.target && e.target.matches('[data-group],[data-group-label]')){
      scheduleMeterUpdate();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && e.target && e.target.id === "player-name-input"){
      e.preventDefault();
      var btn = document.querySelector('[data-action="save-name"]');
      if (btn) btn.click();
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]')){
      e.preventDefault();
      e.target.click();
    }
  });

  /* ---------------- boot ---------------- */
  function boot(){
    initLibrary();
    initStats();
    loadLocalPlayer();
    if (BACKEND){
      storageMode = "http";
      loadRemoteState();
      syncPlayer();
    } else if (window.claude && typeof window.claude.use === "function"){
      storageMode = "artifact";
      window.claude.use("artifact").then(function(cap){ artifactCap = cap; }).catch(function(){ artifactCap = null; });
    }
    if (!tryLoadFromHash()){
      go("home");
    }
    try {
      var pending = sessionStorage.getItem("cw_pending_toast");
      if (pending){
        sessionStorage.removeItem("cw_pending_toast");
        setTimeout(function(){ toast(pending); }, 300);
      }
    } catch (e){}
  }

  /* a share link pasted into an already-open tab changes only the hash */
  window.addEventListener("hashchange", function(){ tryLoadFromHash(); });

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
