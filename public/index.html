<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sixteen items, four hidden connections. Play a random wall, build your own, or share one by link.">
<meta property="og:title" content="Connecting Wall">
<meta property="og:description" content="Sixteen items, four hidden connections. Play a random wall, build your own, or share one by link.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
<title>Connecting Wall</title>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
  :root{
    --stone:#EAEAE1;
    --paper:#FAFAF7;
    --paper-2:#F1F0E9;
    --ink:#22252A;
    --ink-soft:#5A5F66;
    --ink-faint:#8A8F96;
    --line:#D7D5C9;
    --teal:#1F6F6B;
    --teal-strong:#17524F;
    --teal-tint:#E4F0EE;
    --sage:#6E8F4E;
    --sage-tint:#EBF1E1;
    --gold:#B8842A;
    --gold-tint:#F6ECD8;
    --slate:#3E6E96;
    --slate-tint:#E4EEF5;
    --brick:#AB4B39;
    --brick-tint:#F5E4DF;
    --shadow: 0 1px 0 rgba(34,37,42,.06);
    --focus: 0 0 0 3px rgba(31,111,107,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stone:#1B1D20;
      --paper:#242629;
      --paper-2:#2B2D30;
      --ink:#ECEDE9;
      --ink-soft:#AFB3B8;
      --ink-faint:#7D8186;
      --line:#3A3C3E;
      --teal:#4CB0A8;
      --teal-strong:#6FC9C1;
      --teal-tint:#1E3634;
      --sage:#9AC172;
      --sage-tint:#26321F;
      --gold:#E0AC4C;
      --gold-tint:#3A2E1A;
      --slate:#79ADD6;
      --slate-tint:#1F303E;
      --brick:#E08165;
      --brick-tint:#3B231E;
      --shadow: 0 1px 0 rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --stone:#1B1D20;
    --paper:#242629;
    --paper-2:#2B2D30;
    --ink:#ECEDE9;
    --ink-soft:#AFB3B8;
    --ink-faint:#7D8186;
    --line:#3A3C3E;
    --teal:#4CB0A8;
    --teal-strong:#6FC9C1;
    --teal-tint:#1E3634;
    --sage:#9AC172;
    --sage-tint:#26321F;
    --gold:#E0AC4C;
    --gold-tint:#3A2E1A;
    --slate:#79ADD6;
    --slate-tint:#1F303E;
    --brick:#E08165;
    --brick-tint:#3B231E;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, transparent 0 47px, var(--line) 47px 48px),
      repeating-linear-gradient(90deg, transparent 0 71px, var(--line) 71px 72px),
      var(--stone);
    background-blend-mode: normal;
    color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:var(--teal); }
  :focus-visible{ outline:none; box-shadow:var(--focus); border-radius:6px; }
  button, .pill, .action-tile, [role="button"], input[type="text"]{
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }

  .shell{ max-width:760px; margin:0 auto; padding:28px 20px 80px; }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .wordmark{ display:flex; align-items:baseline; gap:10px; cursor:pointer; background:none; border:none; padding:0; }
  .wordmark .brick-icon{ width:22px; height:22px; display:inline-block; position:relative; top:2px; }
  .wordmark h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:.2px;
    line-height:1;
    color:var(--ink);
  }
  .wordmark .tag{ font-size:13px; color:var(--ink-soft); font-style:italic; }
  nav.pills{ display:flex; gap:6px; }
  .pill{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .pill:hover{ border-color:var(--teal); color:var(--ink); }
  .pill[aria-current="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow);
  }

  /* ---------- HOME ---------- */
  .hero{ padding:6px 2px 30px; }
  .hero p.lede{ max-width:52ch; color:var(--ink-soft); font-size:16px; line-height:1.55; margin:10px 0 0; }
  .actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:26px; }
  @media (max-width:620px){ .actions{ grid-template-columns:1fr; } }
  .action-tile{
    text-align:left; cursor:pointer; padding:20px 18px; border-radius:10px;
    border:1px solid var(--line); background:var(--paper);
    display:flex; flex-direction:column; gap:8px; min-height:150px;
    box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s ease;
  }
  .action-tile:hover{ transform:translateY(-2px); border-color:var(--teal); }
  .action-tile.static{ cursor:default; }
  .action-tile.static:hover{ transform:none; border-color:var(--line); }
  .diff-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .action-tile .glyph{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:26px; color:var(--teal); line-height:1; }
  .action-tile h3{ font-size:17px; font-weight:700; }
  .action-tile p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .action-tile .count{ margin-top:auto; font-size:12px; color:var(--ink-faint); }

  .code-box{ margin-top:30px; padding:18px; }
  .timer-box{ margin-top:22px; padding:18px; }
  .timer-box h3{ font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin-bottom:10px; }
  .timer-box .form-note{ margin-top:10px; }
  .code-box h3{ font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin-bottom:10px; }
  .code-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .code-row input{ flex:1; min-width:180px; }

  /* ---------- FORM ELEMENTS ---------- */
  input[type="text"]{
    background:var(--paper-2); border:1px solid var(--line); color:var(--ink);
    border-radius:7px; padding:9px 11px; font-size:14px; width:100%;
  }
  input[type="text"]::placeholder{ color:var(--ink-faint); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:8px; border:1px solid transparent; padding:10px 18px;
    font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ background:var(--teal-strong); }
  .btn-primary:disabled{ background:var(--line); color:var(--ink-faint); cursor:not-allowed; }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--teal); color:var(--teal); }
  .btn-danger{ background:transparent; border-color:var(--line); color:var(--brick); }
  .btn-danger:hover{ border-color:var(--brick); background:var(--brick-tint); }
  .btn-small{ padding:6px 12px; font-size:12.5px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  /* ---------- BUILD ---------- */
  .view-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .view-header h2{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:26px; }
  .group-row{ padding:16px; margin-bottom:12px; }
  .group-row .row-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .group-row .row-head .btn{ flex:none; }
  .swatch{ width:14px; height:14px; border-radius:3px; flex:none; }
  .group-row .row-head input{ font-weight:600; }
  .items-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:560px){ .items-grid{ grid-template-columns:repeat(2,1fr); } }
  .field-error{ border-color:var(--brick) !important; }
  .form-note{ font-size:12.5px; color:var(--ink-faint); margin-top:4px; }
  .title-field{ margin-bottom:16px; max-width:420px; }
  .title-field label, .row-head label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; margin-bottom:4px; }

  /* ---------- PLAY ---------- */
  .play-meta{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  .meta-chip{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
  .meta-chip .mono{ font-size:15px; color:var(--ink); font-weight:600; }
  .meta-chip .mono.timer-low{ color:var(--brick); animation:pulse 1s ease infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .lives{ display:flex; gap:5px; }
  .life-dot{ width:9px; height:9px; border-radius:50%; background:var(--brick); }
  .life-dot.spent{ background:var(--line); }
  .solved-stack{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .solved-bar{
    border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:2px;
    animation:pop .28s ease;
  }
  .solved-bar .tier-badge{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.75; }
  .solved-bar .label{ font-weight:800; font-size:15px; letter-spacing:.01em; }
  .solved-bar .items{ font-size:13px; opacity:.85; }
  @keyframes pop{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  /* The 4x4 grid IS the puzzle — you solve it by scanning for groupings.
     It never collapses to fewer columns; tiles shrink instead. */
  .tile-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tile{
    background:var(--paper); border:1.5px solid var(--line); border-radius:8px;
    min-height:78px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; font-size:14.5px; font-weight:600; color:var(--ink); cursor:pointer;
    line-height:1.25; transition:transform .08s ease, border-color .12s ease, background .12s ease;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  .tile:hover{ border-color:var(--ink-faint); }
  .tile:active{ transform:scale(.96); }
  .tile.selected{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tile.shake{ animation:shake .38s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .play-controls{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .hint{ min-height:20px; font-size:13px; color:var(--gold); font-weight:600; text-align:center; margin:10px 0 0; }

  .end-panel{ margin-top:22px; padding:22px; text-align:center; }
  .end-panel .headline{ font-family:'Big Shoulders Display',sans-serif; font-size:30px; font-weight:900; margin-bottom:4px; }
  .end-stats{ display:flex; justify-content:center; gap:26px; margin:16px 0 20px; flex-wrap:wrap; }
  .end-stats div{ text-align:center; }
  .end-stats .num{ font-size:22px; font-weight:700; display:block; }
  .end-stats .lab{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
  .end-breakdown{ text-align:left; display:flex; flex-direction:column; gap:8px; margin:18px 0; }

  /* ---------- LIBRARY ---------- */
  .sync-note{ font-size:12.5px; color:var(--ink-faint); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--sage); }
  .sync-dot.local{ background:var(--gold); }
  .wall-list{ display:flex; flex-direction:column; gap:10px; }
  .wall-card{ padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .wall-card .info{ flex:1; min-width:180px; }
  .wall-card .info h4{ font-size:16px; margin-bottom:5px; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; }
  .empty-state{ padding:34px 20px; text-align:center; color:var(--ink-soft); }
  .section-head{ font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; margin:22px 0 10px; }

  /* ---------- MODAL / TOAST ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,21,18,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--paper); border-radius:12px; padding:24px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .modal h3{ font-size:18px; margin-bottom:10px; }
  .modal p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; }
  .modal .btn-row{ margin-top:16px; justify-content:flex-end; }
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:60; max-width:90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ---------- phones ----------
     Goal: the whole wall — grid, solved bars and controls — on one screen
     with no scrolling, because scrolling a connecting wall means you can't
     see the groupings you're meant to be spotting. Everything else gives
     way to protect that. */
  @media (max-width:560px){
    .shell{ padding:12px 10px 28px; }

    .topbar{ margin-bottom:12px; gap:8px; align-items:center; }
    .wordmark{ gap:7px; }
    .wordmark h1{ font-size:21px; }
    .wordmark .tag{ display:none; }
    .wordmark .brick-icon{ width:17px; height:17px; top:1px; }
    /* fingers, not cursors: keep tap targets around 34px minimum */
    .pill{ padding:8px 12px; font-size:12.5px; }
    nav.pills{ gap:5px; }
    .wordmark{ padding:4px 0; }

    .view-header{ margin-bottom:10px; gap:8px; }
    .view-header h2{ font-size:20px; }

    .play-meta{ gap:12px; margin-bottom:10px; font-size:12px; }
    .meta-chip{ font-size:12px; }
    .meta-chip .mono{ font-size:13px; }

    .tile-grid{ gap:5px; }
    .tile{
      min-height:0; aspect-ratio:1 / 0.82;
      font-size:11.5px; padding:3px 2px; line-height:1.15;
      border-width:1.25px; border-radius:6px;
      overflow-wrap:anywhere; hyphens:auto;
    }

    .solved-stack{ gap:5px; margin-bottom:5px; }
    .solved-bar{ padding:8px 10px; border-radius:6px; }
    .solved-bar .tier-badge{ font-size:9px; letter-spacing:.06em; }
    .solved-bar .label{ font-size:13px; }
    .solved-bar .items{ font-size:11px; }

    .hint{ margin:6px 0 0; font-size:12px; min-height:16px; }
    .play-controls{ margin-top:10px; gap:8px; }
    .btn{ padding:11px 15px; }
    .btn-small{ padding:9px 12px; font-size:12.5px; }

    .end-panel{ padding:16px 14px; margin-top:14px; }
    .end-panel .headline{ font-size:24px; }
    .end-stats{ gap:16px; margin:12px 0 14px; }
    .end-stats .num{ font-size:18px; }

    .actions{ gap:8px; }
    .action-tile{ min-height:0; padding:14px; gap:6px; }
    .action-tile h3{ font-size:16px; }
    .action-tile p{ font-size:12.5px; }
    .diff-row{ gap:5px; }

    .timer-box, .code-box{ padding:14px; margin-top:14px; }
    .group-row{ padding:12px; }
    .items-grid{ grid-template-columns:repeat(2,1fr); gap:6px; }
    .wall-card{ padding:12px; gap:10px; }

    /* iOS Safari zooms the whole page when you focus an input under 16px,
       and doesn't zoom back out afterwards */
    input[type="text"]{ font-size:16px; padding:10px 11px; }
    .modal{ padding:18px; }
    .modal h3{ font-size:16px; }
  }

  /* taller phones have room to spare once the grid fits — spend it on
     bigger tiles and readable text rather than leaving a gap at the bottom */
  @media (max-width:560px) and (min-height:740px){
    .tile{ aspect-ratio:1 / 0.95; font-size:12.5px; }
    .solved-bar{ padding:10px 12px; }
    .solved-bar .label{ font-size:14px; }
  }
  @media (max-width:560px) and (min-height:860px){
    .tile{ aspect-ratio:1 / 1.05; font-size:13px; }
  }

  /* very narrow phones: buy back width, never tap-target height */
  @media (max-width:360px){
    .shell{ padding:10px 7px 24px; }
    .tile{ font-size:10.5px; }
    .wordmark h1{ font-size:19px; }
    .pill{ padding:9px 9px; font-size:11.5px; }
    .btn-small{ padding:10px 10px; font-size:12px; }
  }

  /* short screens in landscape: the grid still has to fit, but the wide
     format means targets can gain height horizontally instead */
  @media (max-height:560px) and (orientation:landscape){
    .shell{ padding:8px 14px 16px; max-width:820px; }
    .topbar{ margin-bottom:8px; }
    .wordmark .tag{ display:none; }
    .wordmark h1{ font-size:20px; }
    .tile{ aspect-ratio:auto; min-height:46px; font-size:12.5px; }
    .pill{ padding:7px 12px; font-size:12px; }
    .btn-small{ padding:8px 12px; font-size:12px; }
    .play-meta{ margin-bottom:8px; }
    .solved-bar{ padding:6px 10px; }
    .solved-bar .items{ font-size:10.5px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="library-data">[]</script>
<script type="application/json" id="stats-data">{"cats":{},"pairs":{},"walls":0,"batches":[]}</script>
<div id="toast" role="status" aria-live="polite"></div>
<script id="app-script">
(function(){
  'use strict';

  /* ============================================================
     BACKEND — turns on shared saving and shared learning when
     hosting outside Claude.

       ""            no backend; each visitor's browser only
       "same-origin" served by our own Node server (Render)
       "https://..." a backend on a different domain

     The Render server rewrites this line as it serves the page, so
     you don't normally edit it by hand.
     ============================================================ */
  var BACKEND = "";

  /* Three ways this page can store things, picked automatically:
       "http"     - a backend is configured above (shared, no reload)
       "artifact" - running inside Claude, page republishes itself
       "local"    - neither; this browser only                        */
  var storageMode = "local";

  /* tier = how obscure the KNOWLEDGE is: 0 common, 1 general, 2 specialist, 3 wordplay.
     key = stable id, used by the decoy index to measure how much a wall misdirects. */
  var CATEGORIES = [
    /* ---- tier 0: most people place these instantly ---- */
    { tier:0, key:"planets", label:"Planets", items:["Mercury","Venus","Mars","Neptune"] },
    { tier:0, key:"card-suits", label:"Card suits", items:["Hearts","Clubs","Diamonds","Spades"] },
    { tier:0, key:"compass-points", label:"Compass points", items:["North","South","East","West"] },
    { tier:0, key:"seasons", label:"Seasons", items:["Spring","Summer","Autumn","Winter"] },
    { tier:0, key:"rainbow-colours", label:"Colours of the rainbow", items:["Red","Orange","Yellow","Indigo"] },
    { tier:0, key:"dog-breeds", label:"Dog breeds", items:["Beagle","Poodle","Boxer","Husky"] },
    { tier:0, key:"big-cats", label:"Big cats", items:["Lion","Tiger","Leopard","Jaguar"] },
    { tier:0, key:"farm-animals", label:"Farm animals", items:["Cow","Sheep","Goat","Pig"] },
    { tier:0, key:"face-features", label:"Parts of the face", items:["Nose","Chin","Cheek","Brow"] },
    { tier:0, key:"orchard-fruit", label:"Orchard fruit", items:["Apple","Pear","Cherry","Plum"] },
    { tier:0, key:"citrus", label:"Citrus fruits", items:["Lemon","Lime","Tangerine","Grapefruit"] },
    { tier:0, key:"vegetables", label:"Vegetables", items:["Carrot","Potato","Onion","Parsnip"] },
    { tier:0, key:"breakfast-foods", label:"Breakfast foods", items:["Pancake","Waffle","Bacon","Porridge"] },

  var play = null;
  var toastTimer = null;
  var TIMER_LABELS = { none:"Untimed", stopwatch:"Stopwatch", "180":"3 min", "300":"5 min", "600":"10 min" };
  var timerMode = "stopwatch";
  try {
    var savedTimerMode = localStorage.getItem("cw_timer_mode");
    if (savedTimerMode && TIMER_LABELS[savedTimerMode]) timerMode = savedTimerMode;
  } catch (e){}

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function app(){ return document.getElementById("app"); }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function uid(){ return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function toast(msg, ms){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, ms || 2400);
  }

  function randomTitle(diffLabel){
    var base = TITLE_WORDS[Math.floor(Math.random() * TITLE_WORDS.length)] + " Wall";
    return (diffLabel && diffLabel !== "Mixed") ? diffLabel + " " + base : base;
  }

  /* the tier the DATA says, falling back to the hand-assigned one */
  function tierFor(cat){
    return (typeof effectiveTier === "function") ? effectiveTier(cat) : cat.tier;
  }

  function categoriesByTier(tier){
    var byLearned = CATEGORIES.filter(function(c){ return tierFor(c) === tier; });
    return byLearned.length >= 4 ? byLearned
      : CATEGORIES.filter(function(c){ return c.tier === tier; });
  }

  /* ---------------- overlap / trap scoring ----------------
     A wall is hard when its items MISDIRECT: an item that plausibly reads as
     belonging to another group in the same grid. We measure that instead of
     asserting it. Two sources feed the index: hand-written decoy hints, and
     literal cross-membership found automatically across the bank. */
  var DECOY_INDEX = (function(){
    var idx = {};
    function add(item, key){
      var k = item.toLowerCase();
      if (!idx[k]) idx[k] = [];
      if (idx[k].indexOf(key) === -1) idx[k].push(key);
    }
    CATEGORIES.forEach(function(c){
      c.items.forEach(function(item){ add(item, c.key); });
    });
    Object.keys(DECOY_HINTS).forEach(function(item){
      DECOY_HINTS[item].forEach(function(key){ add(item, key); });
    });
    return idx;
  })();

  function wallStats(cats){
    var keys = cats.map(function(c){ return c.key; });
    var seen = {}, traps = 0;
    for (var i = 0; i < cats.length; i++){
      /* decoy links players taught us, on top of the ones written by hand */
      var learned = learnedPairsFor(cats[i].key);
      for (var k0 = 0; k0 < keys.length; k0++){
        if (k0 !== i && learned.indexOf(keys[k0]) !== -1){ traps++; }
      }
      for (var j = 0; j < cats[i].items.length; j++){
        var item = cats[i].items[j], lower = item.toLowerCase();
        /* the same item in two groups isn't hard, it's broken */
        if (seen[lower]) return { valid:false, traps:0 };
        seen[lower] = true;
        var fits = DECOY_INDEX[lower] || [];
        for (var k = 0; k < keys.length; k++){
          if (k !== i && fits.indexOf(keys[k]) !== -1){ traps++; break; }
        }
      }
    }
    return { valid:true, traps:traps };
  }

  /* Which categories can misdirect toward each other. Trap-rich walls are rare
     (most random quartets have no overlap at all), so the generator walks this
     graph to find them rather than sampling blindly. */
  var CATEGORY_LINKS = (function(){
    var byKey = {}, links = {};
    CATEGORIES.forEach(function(c){ byKey[c.key] = c; links[c.key] = {}; });
    CATEGORIES.forEach(function(c){
      c.items.forEach(function(item){
        (DECOY_INDEX[item.toLowerCase()] || []).forEach(function(other){
          if (other !== c.key && byKey[other]){
            links[c.key][other] = true;
            links[other][c.key] = true;
          }
        });
      });
    });
    var out = {};
    Object.keys(links).forEach(function(k){ out[k] = Object.keys(links[k]); });
    return out;
  })();

  /* traps = target misdirection band. Knowledge tier is a light secondary input:
     a wall of "easy" categories can still be fiendish if the items overlap. */
  var DIFFICULTY_SPECS = {
    mixed:  { label:"Mixed",  perTier:true, traps:[2,5],  wordplay:null,  linked:false },
    easy:   { label:"Easy",   tiers:[0,1],  traps:[0,1],  wordplay:false, linked:false, preferCommon:true },
    medium: { label:"Medium", tiers:null,   traps:[2,4],  wordplay:null,  linked:true },
    hard:   { label:"Hard",   tiers:null,   traps:[5,7],  wordplay:null,  linked:true },
    genius: { label:"Genius", tiers:null,   traps:[8,16], wordplay:true,  linked:true }
  };

  var recentKeys = [];

  function pickFour(pool){
    if (pool.length < 4) return null;
    return shuffle(pool).slice(0, 4);
  }

  /* Grow a quartet outward from a seed along decoy links, so the chosen
     categories actually have something to confuse each other with. */
  function pickLinked(pool, byKey){
    var seed = pool[Math.floor(Math.random() * pool.length)];
    var chosen = [seed], chosenKeys = { };
    chosenKeys[seed.key] = true;
    while (chosen.length < 4){
      var candidates = [];
      chosen.forEach(function(c){
        (CATEGORY_LINKS[c.key] || []).forEach(function(k){
          if (!chosenKeys[k] && byKey[k]) candidates.push(byKey[k]);
        });
      });
      var next;
      if (candidates.length && Math.random() < 0.9){
        next = candidates[Math.floor(Math.random() * candidates.length)];
      } else {
        next = pool[Math.floor(Math.random() * pool.length)];
      }
      if (!next || chosenKeys[next.key]) {
        next = pool[Math.floor(Math.random() * pool.length)];
        if (!next || chosenKeys[next.key]) continue;
      }
      chosenKeys[next.key] = true;
      chosen.push(next);
    }
    return chosen;
  }

  function generateWall(diffKey){
    var spec = DIFFICULTY_SPECS[diffKey] || DIFFICULTY_SPECS.mixed;
    var pool = (spec.perTier || !spec.tiers) ? CATEGORIES
      : CATEGORIES.filter(function(c){ return spec.tiers.indexOf(tierFor(c)) !== -1; });
    var byKey = {};
    pool.forEach(function(c){ byKey[c.key] = c; });
    /* aim anywhere in the band, not always dead centre, so repeat plays differ */
    var target = spec.traps[0] + Math.random() * (spec.traps[1] - spec.traps[0]);
    var best = null, bestScore = Infinity;

    for (var n = 0; n < 1200; n++){
      var cats;
      if (spec.perTier){
        cats = TIER_COLORS.map(function(_, tier){
          var p = categoriesByTier(tier);
          return p[Math.floor(Math.random() * p.length)];
        });
      } else if (spec.linked){
        cats = pickLinked(pool, byKey);
      } else {
        cats = pickFour(pool);
      }
      if (!cats) break;
      var st = wallStats(cats);
      if (!st.valid) continue;

      var score = Math.abs(st.traps - target);
      if (st.traps < spec.traps[0]) score += 4;
      var hasWordplay = cats.some(function(c){ return tierFor(c) === 3; });
      if (spec.wordplay === true && !hasWordplay) score += 8;
      if (spec.wordplay === false && hasWordplay) score += 5;
      /* "Easy" should mean easy knowledge too, not just a cleanly separable grid */
      if (spec.preferCommon){
        for (var q = 0; q < cats.length; q++){ if (cats[q].tier > 0) score += 0.7; }
      }
      /* the densest corner of the decoy graph would otherwise win every time */
      for (var r = 0; r < cats.length; r++){
        if (recentKeys.indexOf(cats[r].key) !== -1) score += 1.6;
      }

      if (score < bestScore){ bestScore = score; best = { cats:cats, stats:st }; }
      if (score < 0.25) break;
    }

    if (!best){
      var fallback = pickFour(pool) || CATEGORIES.slice(0, 4);
      best = { cats: fallback, stats: wallStats(fallback) };
    }

    best.cats.forEach(function(c){ recentKeys.push(c.key); });
    while (recentKeys.length > 16) recentKeys.shift();

    var colors = shuffle(TIER_COLORS);
    return {
      id: uid(),
      title: randomTitle(spec.label),
      difficulty: spec.label,
      traps: best.stats.traps,
      groups: best.cats.map(function(c, i){
        return { label: c.label, color: colors[i], tier: tierFor(c), key: c.key, items: c.items.slice() };
      })
    };
  }

  /* ---------------- share encode/decode ---------------- */
  function encodeWall(wall){
    var json = JSON.stringify({ t: wall.title, g: wall.groups.map(function(g){ return [g.label, g.color, g.items]; }) });
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decodeWall(code){
    var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var json = decodeURIComponent(escape(atob(b64)));
    var data = JSON.parse(json);
    if (!data || !Array.isArray(data.g) || data.g.length !== 4) throw new Error("bad shape");
    var groups = data.g.map(function(g){
      if (!Array.isArray(g) || g.length !== 3 || !Array.isArray(g[2]) || g[2].length !== 4) throw new Error("bad group");
      var color = COLORS.indexOf(g[1]) >= 0 ? g[1] : "sage";
      return { label: String(g[0]), color: color, tier: TIER_COLORS.indexOf(color), items: g[2].map(String) };
    });
    return { id: uid(), title: String(data.t || "Shared Wall"), groups: groups };
  }
  function tierOf(g){
    return (typeof g.tier === "number") ? g.tier : TIER_COLORS.indexOf(g.color);
  }
  function shareUrlFor(wall){
    return location.origin + location.pathname + "#w=" + encodeWall(wall);
  }

  /* ---------------- persistence ---------------- */
  function readEmbeddedLibrary(){
    var node = document.getElementById("library-data");
    try { return node ? (JSON.parse(node.textContent || "[]") || []) : []; }
    catch (e){ return []; }
  }
  function readLocalLibrary(){
    try { return JSON.parse(localStorage.getItem("cw_local_library") || "[]") || []; }
    catch (e){ return []; }
  }
  function writeLocalLibrary(list){
    try { localStorage.setItem("cw_local_library", JSON.stringify(list)); } catch (e){}
  }

  function initLibrary(){
    var embedded = readEmbeddedLibrary();
    var local = readLocalLibrary();
    var byId = {};
    embedded.forEach(function(w){ byId[w.id] = w; });
    local.forEach(function(w){ if (!byId[w.id]) byId[w.id] = w; });
    library = Object.keys(byId).map(function(k){ return byId[k]; });
  }

  /* ---------------- shared learning ----------------
     Every finished wall contributes anonymous, category-level counters to the
     document itself, so what one player teaches it, every player gets. Counters
     are additive, which makes merging across simultaneous players safe: two
     people finishing at once can't corrupt each other, the loser just merges
     into the winning version on the next write. */
  var MIN_OBS = 8;        // observations before data may move a category at all
  var PRIOR_WEIGHT = 10;  // how hard the hand-assigned tier resists the data
  var PAIR_MIN = 4;       // wrong-guess confusions before a decoy edge is believed

  var stats = { cats:{}, pairs:{}, walls:0, batches:[] };
  var backendUp = null;

  function blankCat(){ return { shown:0, solved:0, rankSum:0, rankN:0, hints:0 }; }

  function readEmbeddedStats(){
    var node = document.getElementById("stats-data");
    try {
      var s = node ? JSON.parse(node.textContent || "{}") : {};
      return { cats:s.cats||{}, pairs:s.pairs||{}, walls:s.walls||0, batches:s.batches||[] };
    } catch (e){ return { cats:{}, pairs:{}, walls:0, batches:[] }; }
  }

  function readPending(){
    try { return JSON.parse(localStorage.getItem("cw_pending_stats") || "null"); }
    catch (e){ return null; }
  }
  function writePending(p){
    try {
      if (p) localStorage.setItem("cw_pending_stats", JSON.stringify(p));
      else localStorage.removeItem("cw_pending_stats");
    } catch (e){}
  }

  /* ---------------- HTTP backend (hosting outside Claude) ----------------
     Counters are additive, so the server can merge concurrent players with an
     atomic increment. That makes this mode strictly better than republishing
     the page: writes are instant, nobody gets reloaded, and two people
     finishing a wall at the same moment can't collide. */
  /* same-origin needs no host: relative paths keep it CORS-free */
  function apiUrl(path){
    return BACKEND === "same-origin" ? path : BACKEND.replace(/\/+$/, "") + path;
  }

  function apiGet(path){
    return fetch(apiUrl(path), { method:"GET", headers:{ "Accept":"application/json" } })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function apiPost(path, body){
    return fetch(apiUrl(path), {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    }).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  /* Pull shared walls + learning at boot. Failure is not fatal: the page
     falls back to this device so a backend outage never blocks play. */
  function loadRemoteState(){
    return apiGet("/api/state").then(function(state){
      if (state && Array.isArray(state.walls)) library = state.walls;
      if (state && state.stats){
        stats = {
          cats: state.stats.cats || {},
          pairs: state.stats.pairs || {},
          walls: state.stats.walls || 0,
          batches: []
        };
      }
      backendUp = true;
      render();
    }).catch(function(){
      backendUp = false;
      /* keep whatever this device knows and carry on */
      render();
    });
  }

  function flushStatsRemote(){
    var pending = readPending();
    if (!pending || !pending.walls) return;
    /* clear first: the server merges additively and a repeat would double-count */
    writePending(null);
    apiPost("/api/stats", { cats: pending.cats, pairs: pending.pairs, walls: pending.walls })
      .then(function(res){
        backendUp = true;
        if (res && res.stats){
          stats = { cats: res.stats.cats || {}, pairs: res.stats.pairs || {}, walls: res.stats.walls || 0, batches: [] };
        }
      })
      .catch(function(){
        backendUp = false;
        /* put it back so nothing is lost, and keep it on this device meanwhile */
        var again = readPending();
        writePending(again ? mergePendingBuffers(again, pending) : pending);
        flushStatsLocal();
      });
  }

  function mergePendingBuffers(a, b){
    var out = { id: a.id || b.id, cats:{}, pairs:{}, walls:(a.walls||0)+(b.walls||0) };
    [a, b].forEach(function(src){
      Object.keys(src.cats||{}).forEach(function(k){
        if (!out.cats[k]) out.cats[k] = blankCat();
        var s = src.cats[k], d = out.cats[k];
        d.shown+=s.shown||0; d.solved+=s.solved||0; d.rankSum+=s.rankSum||0; d.rankN+=s.rankN||0; d.hints+=s.hints||0;
      });
      Object.keys(src.pairs||{}).forEach(function(k){ out.pairs[k] = (out.pairs[k]||0) + src.pairs[k]; });
    });
    return out;
  }

  /* True only when this copy can actually write back to a shared document.
     False on a plain web host (no Claude runtime) and for read-only viewers —
     in both cases the page still learns, just for this device alone. */
  function isShared(){
    if (storageMode === "http") return backendUp !== false;
    return !!artifactCap && writable !== false;
  }

  function readLocalStats(){
    try { return JSON.parse(localStorage.getItem("cw_local_stats") || "null"); }
    catch (e){ return null; }
  }

  /* Standalone fallback: fold this device's buffered plays into its own store,
     so learning still accumulates with nowhere to publish to. */
  function flushStatsLocal(){
    var pending = readPending();
    if (!pending || !pending.walls) return;
    var base = readLocalStats() || { cats:{}, pairs:{}, walls:0, batches:[] };
    var saved = stats;
    stats = base;
    var merged = mergePendingIntoStats();
    stats = saved;
    if (!merged.merged) return;
    try { localStorage.setItem("cw_local_stats", JSON.stringify(merged.stats)); } catch (e){}
    writePending(null);
    /* reflect it immediately so the Learning tab isn't stale */
    stats = mergeStatObjects(readEmbeddedStats(), merged.stats);
  }

  function mergeStatObjects(a, b){
    var out = { cats:{}, pairs:{}, walls:(a.walls||0) + (b.walls||0), batches:(a.batches||[]).concat(b.batches||[]) };
    [a, b].forEach(function(src){
      Object.keys(src.cats || {}).forEach(function(k){
        if (!out.cats[k]) out.cats[k] = blankCat();
        var s = src.cats[k], d = out.cats[k];
        d.shown += s.shown||0; d.solved += s.solved||0;
        d.rankSum += s.rankSum||0; d.rankN += s.rankN||0; d.hints += s.hints||0;
      });
      Object.keys(src.pairs || {}).forEach(function(k){
        out.pairs[k] = (out.pairs[k] || 0) + src.pairs[k];
      });
    });
    return out;
  }

  function initStats(){
    stats = readEmbeddedStats();
    /* a device that has been learning on its own carries its own store */
    var local = readLocalStats();
    if (local) stats = mergeStatObjects(stats, local);
    /* A publish reloads the page, so a batch may have landed in the document
       even though this device never saw the success callback. The batch id
       tells us which: if the document already counted it, drop it. */
    var pending = readPending();
    if (pending && pending.id && stats.batches.indexOf(pending.id) !== -1){
      writePending(null);
    }
  }

  function addObservation(buf, key, fn){
    if (!buf.cats[key]) buf.cats[key] = blankCat();
    fn(buf.cats[key]);
  }

  /* Called once when a wall ends. Records only bank categories — a wall you
     wrote yourself has no key, and there's nothing general to learn from it. */
  function recordPlay(){
    var w = play.wall;
    if (!w || !w.groups) return;
    var anyKey = w.groups.some(function(g){ return !!g.key; });
    if (!anyKey) return;

    var pending = readPending() || { id:"b" + uid(), cats:{}, pairs:{}, walls:0 };

    w.groups.forEach(function(g, gi){
      if (!g.key) return;
      addObservation(pending, g.key, function(c){ c.shown++; });
      var solvedPos = play.solvedOrder ? play.solvedOrder.indexOf(gi) : -1;
      if (solvedPos !== -1){
        addObservation(pending, g.key, function(c){
          c.solved++;
          /* rank, not seconds: measured inside one wall, so it self-normalises
             for a slow player, a phone call, or a tab left open */
          c.rankSum += (solvedPos + 1);
          c.rankN++;
        });
      }
      if (play.hintedGroups && play.hintedGroups.indexOf(gi) !== -1){
        addObservation(pending, g.key, function(c){ c.hints++; });
      }
    });

    /* which categories people actually confuse with each other */
    (play.confusions || []).forEach(function(pair){
      var a = w.groups[pair[0]], b = w.groups[pair[1]];
      if (!a || !b || !a.key || !b.key) return;
      var id = [a.key, b.key].sort().join("~");
      pending.pairs[id] = (pending.pairs[id] || 0) + 1;
    });

    pending.walls++;
    writePending(pending);
  }

  function mergePendingIntoStats(){
    var pending = readPending();
    if (!pending) return { stats: stats, merged:false };
    var out = { cats:{}, pairs:{}, walls:(stats.walls||0) + (pending.walls||0), batches:(stats.batches||[]).slice() };
    Object.keys(stats.cats).forEach(function(k){
      out.cats[k] = { shown:stats.cats[k].shown||0, solved:stats.cats[k].solved||0,
                      rankSum:stats.cats[k].rankSum||0, rankN:stats.cats[k].rankN||0, hints:stats.cats[k].hints||0 };
    });
    Object.keys(pending.cats).forEach(function(k){
      if (!out.cats[k]) out.cats[k] = blankCat();
      var s = pending.cats[k], d = out.cats[k];
      d.shown += s.shown||0; d.solved += s.solved||0;
      d.rankSum += s.rankSum||0; d.rankN += s.rankN||0; d.hints += s.hints||0;
    });
    Object.keys(stats.pairs).forEach(function(k){ out.pairs[k] = stats.pairs[k]; });
    Object.keys(pending.pairs).forEach(function(k){ out.pairs[k] = (out.pairs[k]||0) + pending.pairs[k]; });
    out.batches.push(pending.id);
    while (out.batches.length > 40) out.batches.shift();
    return { stats: out, merged:true };
  }

  /* Push learning to the shared document. Batched, because every publish
     reloads the page — doing it per wall would yank players out of the game. */
  function maybeFlushStats(){
    var pending = readPending();
    if (!pending || !pending.walls) return false;
    if (pending.walls < 3) return false;
    if (!artifactCap || writable === false) return false;
    var merged = mergePendingIntoStats();
    if (!merged.merged) return false;
    try { sessionStorage.setItem("cw_pending_toast", "Difficulty updated from recent plays"); } catch (e){}
    artifactCap.publish(buildFullDocument(library, merged.stats)).catch(function(err){
      try { sessionStorage.removeItem("cw_pending_toast"); } catch (e){}
      if (err && err.code === "conflict") return;  // keep buffer, retry later
      writable = false;
    });
    return true;
  }

  /* ---- what the data is allowed to conclude ---- */
  function effectiveTier(cat){
    var s = stats.cats[cat.key];
    if (!s || s.rankN < MIN_OBS) return cat.tier;
    var meanRank = s.rankSum / s.rankN;          // 1 = found first, 4 = found last
    var hintRate = s.shown ? s.hints / s.shown : 0;
    var missRate = s.shown ? 1 - (s.solved / s.shown) : 0;
    /* 2.5 is a neutral rank; above it the group tends to resist solving */
    var signal = (meanRank - 2.5) / 1.5 + hintRate * 1.2 + missRate * 1.2;
    /* shrink toward the hand-assigned tier in proportion to evidence */
    var weight = s.rankN / (s.rankN + PRIOR_WEIGHT);
    var delta = Math.max(-1, Math.min(1, Math.round(signal * weight * 2)));
    return Math.max(0, Math.min(3, cat.tier + delta));
  }

  function learnedPairsFor(key){
    var out = [];
    Object.keys(stats.pairs).forEach(function(id){
      if (stats.pairs[id] < PAIR_MIN) return;
      var parts = id.split("~");
      if (parts[0] === key) out.push(parts[1]);
      else if (parts[1] === key) out.push(parts[0]);
    });
    return out;
  }

  function buildFullDocument(libArr, statsObj){
    var titleTag = "<title>" + esc(document.title) + "</title>";
    var fontLink = document.getElementById("font-link") ? document.getElementById("font-link").outerHTML : "";
    var styleTag = document.getElementById("app-style") ? document.getElementById("app-style").outerHTML : "";
    var scriptTag = document.getElementById("app-script") ? document.getElementById("app-script").outerHTML : "";
    var dataJson = JSON.stringify(libArr).replace(/</g, "\\u003c");
    var statsJson = JSON.stringify(statsObj || stats).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      titleTag + "\n" + fontLink + "\n" + styleTag + "\n</head>\n<body>\n<div id=\"app\"></div>\n" +
      "<script type=\"application/json\" id=\"library-data\">" + dataJson + "<" + "/script>\n" +
      "<script type=\"application/json\" id=\"stats-data\">" + statsJson + "<" + "/script>\n" +
      "<div id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n" +
      scriptTag + "\n</body>\n</html>";
  }

  function saveLibrary(newList, opts){
    library = newList;
    opts = opts || {};

    if (storageMode === "http"){
      render();
      apiPost("/api/walls", { walls: newList })
        .then(function(){ backendUp = true; })
        .catch(function(){
          backendUp = false;
          writeLocalLibrary(newList);
          toast("Couldn't reach the server — saved on this device");
          render();
        });
      if (opts.sharedMsg) toast(opts.sharedMsg);
      return;
    }

    var attemptShared = artifactCap && writable !== false;
    if (attemptShared){
      /* piggyback any pending play data on this write — one republish, both payloads */
      var merged = mergePendingIntoStats();
      var html = buildFullDocument(newList, merged.stats);
      try { sessionStorage.setItem("cw_pending_toast", opts.sharedMsg || "Saved"); } catch (e){}
      artifactCap.publish(html).then(function(){
        writable = true;
        // a successful html publish reloads this view too; the stashed
        // toast above is what surfaces once the fresh load boots.
      }).catch(function(errObj){
        try { sessionStorage.removeItem("cw_pending_toast"); } catch (e){}
        var code = errObj && errObj.code;
        if (code === "conflict"){
          // view is already being reloaded to the winning version;
          // the pending batch stays buffered and merges into that one instead
          return;
        }
        writable = false;
        writeLocalLibrary(newList);
        toast(opts.localMsg || "Saved on this device only");
        render();
      });
      if (opts.optimistic) render();
    } else {
      writeLocalLibrary(newList);
      render();
      if (opts.localMsg) toast(opts.localMsg);
    }
  }

  function addToLibrary(wall){
    var withoutDup = library.filter(function(w){ return w.id !== wall.id; });
    var next = withoutDup.concat([wall]);
    saveLibrary(next, { optimistic:true, sharedMsg:"Saved to My Walls", localMsg:"Saved to My Walls (this device only)" });
  }
  function removeFromLibrary(id){
    var next = library.filter(function(w){ return w.id !== id; });
    saveLibrary(next, { optimistic:true, sharedMsg:"Removed from My Walls", localMsg:"Removed (this device only)" });
  }

  /* ---------------- routing ---------------- */
  function go(v){
    if (play && play.timerId && v !== "play"){
      clearInterval(play.timerId);
      play.timerId = null;
    }
    view = v;
    render();
    window.scrollTo(0, 0);
  }

  function tryLoadFromHash(){
    var h = location.hash || "";
    var m = h.match(/#w=([^&]+)/);
    if (!m) return false;
    try {
      var wall = decodeWall(decodeURIComponent(m[1]));
      history.replaceState(null, "", location.pathname + location.search);
      currentWall = wall;
      startPlay(wall);
      return true;
    } catch (e){
      history.replaceState(null, "", location.pathname + location.search);
      toast("That link's puzzle data looks broken");
      return false;
    }
  }

  function openCodeInput(raw){
    var code = (raw || "").trim();
    var m = code.match(/#w=([^&]+)/);
    if (m) code = decodeURIComponent(m[1]);
    if (!code){ toast("Paste a wall link or code first"); return; }
    try {
      var wall = decodeWall(code);
      currentWall = wall;
      startPlay(wall);
    } catch (e){
      toast("Couldn't read that code");
    }
  }

  /* ---------------- play mechanics ---------------- */
  function startPlay(wall){
    var pool = [];
    wall.groups.forEach(function(g, gi){
      g.items.forEach(function(item){ pool.push({ item: item, gi: gi }); });
    });
    pool = shuffle(pool);
    var isCountdown = timerMode !== "none" && timerMode !== "stopwatch";
    play = {
      wall: wall,
      pool: pool,
      selected: [],
      solved: [],
      mistakes: 0,
      hintsUsed: 0,
      solvedOrder: [],
      hintedGroups: [],
      confusions: [],
      recorded: false,
      finished: false,
      won: false,
      endReason: null,
      hint: "",
      startedAt: Date.now(),
      elapsed: 0,
      timerMode: isCountdown ? "countdown" : timerMode,
      timeLimit: isCountdown ? parseInt(timerMode, 10) : null,
      timerId: null
    };
    view = "play";
    render();
    play.timerId = setInterval(function(){
      if (!play || play.finished) return;
      play.elapsed = Math.floor((Date.now() - play.startedAt) / 1000);
      var el = document.getElementById("timer-readout");
      if (play.timerMode === "countdown"){
        var remain = play.timeLimit - play.elapsed;
        if (remain <= 0){
          play.elapsed = play.timeLimit;
          finishPlay(false, "time");
          return;
        }
        if (el){ el.textContent = formatTime(remain); el.classList.toggle("timer-low", remain <= 30); }
      } else if (play.timerMode === "stopwatch" && el){
        el.textContent = formatTime(play.elapsed);
      }
    }, 1000);
  }

  function formatTime(s){
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function toggleTile(idx){
    if (play.finished || play.locked) return;
    var pos = play.selected.indexOf(idx);
    if (pos >= 0){ play.selected.splice(pos, 1); }
    else {
      if (play.selected.length >= 4) return;
      play.selected.push(idx);
    }
    play.hint = "";
    renderPlayBody();
    if (play.selected.length === 4){
      play.locked = true;
      setTimeout(function(){
        play.locked = false;
        submitGuess();
      }, 350);
    }
  }

  function submitGuess(){
    if (play.selected.length !== 4 || play.finished) return;
    var gis = play.selected.map(function(idx){ return play.pool[idx].gi; });
    var allSame = gis.every(function(g){ return g === gis[0]; });
    if (allSame){
      var gi = gis[0];
      play.solved.push(gi);
      play.solvedOrder.push(gi);
      var solvedIdx = play.selected.slice();
      play.pool = play.pool.filter(function(_, i){ return solvedIdx.indexOf(i) === -1; });
      play.selected = [];
      play.hint = "";
      if (play.solved.length === 4){
        finishPlay(true);
        return;
      }
      renderPlayBody();
    } else {
      play.mistakes++;
      var counts = {};
      gis.forEach(function(g){ counts[g] = (counts[g] || 0) + 1; });
      var maxCount = Math.max.apply(null, Object.keys(counts).map(function(k){ return counts[k]; }));
      play.hint = maxCount === 3 ? "One away..." : "";
      /* a wrong guess IS the measurement: these groups just got confused */
      var involved = Object.keys(counts).map(Number);
      for (var a = 0; a < involved.length; a++){
        for (var b = a + 1; b < involved.length; b++){
          play.confusions.push([involved[a], involved[b]]);
        }
      }
      var idxs = play.selected.slice();
      play.selected = [];
      renderPlayBody();
      idxs.forEach(function(idx){
        var node = document.querySelector('.tile[data-idx="' + idx + '"]');
        if (node){ node.classList.add("shake"); setTimeout(function(){ node.classList.remove("shake"); }, 380); }
      });
      if (play.mistakes >= MAX_MISTAKES){
        finishPlay(false, "mistakes");
      }
    }
  }

  function finishPlay(won, reason){
    play.finished = true;
    play.won = won;
    play.endReason = won ? "won" : (reason || "mistakes");
    clearInterval(play.timerId);
    if (!play.recorded){
      play.recorded = true;
      try {
        recordPlay();
        /* a backend takes writes instantly with no reload, so send every wall;
           the artifact path batches, and with neither we keep it on-device */
        if (storageMode === "http") flushStatsRemote();
        else if (!isShared()) flushStatsLocal();
      } catch (e){}
    }
    if (!won){
      for (var gi = 0; gi < 4; gi++){
        if (play.solved.indexOf(gi) === -1) play.solved.push(gi);
      }
    }
    render();
  }

  function scoreFor(){
    if (!play.won) return 0;
    var timePenalty = play.timerMode === "none" ? 0 : play.elapsed * 3;
    return Math.max(0, 1000 - play.mistakes * 150 - timePenalty);
  }

  function useHint(){
    if (play.finished) return;
    var remaining = play.wall.groups.map(function(_, i){ return i; })
      .filter(function(i){ return play.solved.indexOf(i) === -1; });
    if (!remaining.length) return;
    /* give away the easiest one still standing — by the group's own tier,
       not its position in the grid */
    remaining.sort(function(a, b){
      return tierOf(play.wall.groups[a]) - tierOf(play.wall.groups[b]);
    });
    var gi = remaining[0];
    play.hintsUsed++;
    play.mistakes++;
    if (play.hintedGroups.indexOf(gi) === -1) play.hintedGroups.push(gi);
    var g = play.wall.groups[gi];
    var tname = TIER_NAMES[tierOf(g)] || "";
    toast('Hint' + (tname ? ' (' + tname + ')' : '') + ': "' + g.label + '" — costs a guess', 3400);
    if (play.mistakes >= MAX_MISTAKES){
      finishPlay(false, "mistakes");
    } else {
      renderPlayBody();
    }
  }

  function validateBuild(draft){
    var errors = [];
    draft.groups.forEach(function(g, gi){
      if (!g.label) errors.push({ sel: '[data-group-label="' + gi + '"]' });
      g.items.forEach(function(v, ii){
        if (!v) errors.push({ sel: '[data-group="' + gi + '"][data-item="' + ii + '"]' });
      });
    });
    var allItems = draft.groups.reduce(function(acc, g){ return acc.concat(g.items.map(function(v){ return v.toLowerCase(); })); }, []);
    var seen = {}, dupes = false;
    allItems.forEach(function(v){ if (v){ if (seen[v]) dupes = true; seen[v] = true; } });
    return { errors: errors, dupes: dupes };
  }

  /* ---------------- render: WHAT IT'S LEARNED ---------------- */
  function renderLearned(){
    var byKey = {};
    CATEGORIES.forEach(function(c){ byKey[c.key] = c; });
    var pending = readPending();
    var pendingWalls = pending ? (pending.walls || 0) : 0;

    var moved = CATEGORIES.map(function(c){
      var eff = effectiveTier(c), s = stats.cats[c.key];
      return { cat:c, eff:eff, obs: s ? s.rankN : 0,
               rank: (s && s.rankN) ? (s.rankSum / s.rankN) : null };
    }).filter(function(r){ return r.eff !== r.cat.tier; });

    var pairs = Object.keys(stats.pairs)
      .filter(function(id){ return stats.pairs[id] >= PAIR_MIN; })
      .sort(function(a, b){ return stats.pairs[b] - stats.pairs[a]; })
      .slice(0, 12)
      .map(function(id){
        var p = id.split("~");
        return { a: byKey[p[0]], b: byKey[p[1]], n: stats.pairs[id] };
      })
      .filter(function(p){ return p.a && p.b; });

    var observed = CATEGORIES.filter(function(c){
      var s = stats.cats[c.key]; return s && s.rankN >= MIN_OBS;
    }).length;

    var head =
      '<div class="view-header"><h2>What it has learned</h2>' +
        '<button class="btn btn-ghost btn-small" data-action="go-home">Back</button>' +
      '</div>' +
      '<p class="form-note" style="margin-bottom:16px">' +
        (isShared()
          ? 'Every finished wall teaches the shared copy, so what one player finds hard, everyone\'s walls reflect. '
          : 'This copy learns on this device only — it has nowhere shared to write back to. ') +
        '<strong>' + (stats.walls || 0) + '</strong> walls recorded &middot; <strong>' + observed + '</strong> of ' + CATEGORIES.length +
        ' categories have enough data to move' + (pendingWalls ? ' &middot; ' + pendingWalls + ' waiting to sync' : '') + '.</p>';

    if (!stats.walls && !pendingWalls){
      return head + '<div class="card empty-state">Nothing learned yet. Play a few walls and the difficulty will start tuning itself &mdash; a category found last, or hinted often, drifts harder; one found first drifts easier. It needs ' + MIN_OBS + ' solves of a category before it will move it at all.</div>';
    }

    var movedHtml = moved.length
      ? '<div class="wall-list">' + moved.map(function(r){
          var harder = r.eff > r.cat.tier;
          var col = harder ? "brick" : "sage";
          return '<div class="card wall-card">' +
            '<div class="info"><h4>' + esc(r.cat.label) + '</h4>' +
              '<div class="chip-row">' +
                '<span class="chip" style="background:var(--' + col + '-tint); color:var(--' + col + ')">' +
                  TIER_NAMES[r.cat.tier] + ' &rarr; ' + TIER_NAMES[r.eff] + '</span>' +
                '<span class="chip" style="background:var(--paper-2); color:var(--ink-soft)">' +
                  'found ' + r.rank.toFixed(1) + ' of 4 on average, ' + r.obs + ' solves</span>' +
              '</div>' +
            '</div></div>';
        }).join("") + '</div>'
      : '<div class="card empty-state">No category has shifted tier yet. It takes ' + MIN_OBS + ' solves plus a consistent signal before the data is allowed to override the starting difficulty.</div>';

    var pairsHtml = pairs.length
      ? '<div class="wall-list">' + pairs.map(function(p){
          return '<div class="card wall-card">' +
            '<div class="info"><h4>' + esc(p.a.label) + ' &harr; ' + esc(p.b.label) + '</h4>' +
              '<div class="chip-row"><span class="chip" style="background:var(--gold-tint); color:var(--gold)">' +
                'confused ' + p.n + ' times</span></div>' +
            '</div></div>';
        }).join("") + '</div>'
      : '<div class="card empty-state">No confusions confirmed yet. When the same two groups get mixed up ' + PAIR_MIN + ' times, that pairing is treated as a genuine trap and the generator starts using it.</div>';

    return head +
      '<h3 class="section-head">Difficulty the data changed</h3>' + movedHtml +
      '<h3 class="section-head">Traps players discovered</h3>' + pairsHtml;
  }

  /* ---------------- render: LIBRARY ---------------- */
  function renderLibrary(){
    var note = writable === false
      ? '<div class="sync-note"><span class="sync-dot local"></span>Saved on this device only</div>'
      : isShared()
        ? '<div class="sync-note"><span class="sync-dot"></span>Shared — anyone with this page’s link sees these too</div>'
        : '<div class="sync-note"><span class="sync-dot local"></span>Saved on this device</div>';
    if (!library.length){
      return (
        '<div class="view-header"><h2>My walls</h2></div>' +
        note +
        '<div class="card empty-state">No walls saved yet. Build one, or save a random wall you like from the results screen.</div>'
      );
    }
    var rows = library.slice().reverse().map(function(w){
      var chips = w.groups.map(function(g){
        return '<span class="chip" style="background:var(--' + g.color + '-tint); color:var(--' + g.color + ')"><span class="dot" style="background:var(--' + g.color + ')"></span>' + esc(g.label) + '</span>';
      }).join("");
      return (
        '<div class="card wall-card">' +
          '<div class="info"><h4>' + esc(w.title) + '</h4><div class="chip-row">' + chips + '</div></div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-primary btn-small" data-action="play-wall" data-id="' + w.id + '">Play</button>' +
            '<button class="btn btn-ghost btn-small" data-action="share-saved" data-id="' + w.id + '">Share</button>' +
            '<button class="btn btn-danger btn-small" data-action="delete-wall" data-id="' + w.id + '">Delete</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="view-header"><h2>My walls</h2></div>' + note + '<div class="wall-list">' + rows + '</div>';
  }

  /* ---------------- modal ---------------- */
  function showShareModal(wall){
    var url = shareUrlFor(wall);
    var wrap = document.createElement("div");
    wrap.className = "overlay";
    wrap.id = "share-overlay";
    wrap.innerHTML =
      '<div class="modal">' +
        '<h3>Share &ldquo;' + esc(wall.title) + '&rdquo;</h3>' +
        '<p>Anyone who opens this link plays this exact wall.</p>' +
        '<input type="text" id="share-link-field" value="' + esc(url) + '" readonly>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
          '<button class="btn btn-primary" data-action="copy-link">Copy link</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var field = document.getElementById("share-link-field");
    field.focus();
    field.select();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast("Link copied"); }).catch(function(){});
    }
  }
  function closeModal(){
    var m = document.getElementById("share-overlay");
    if (m) m.remove();
  }

  /* ---------------- shell / topbar ---------------- */
  function shellHtml(activeView, inner){
    function pill(v, text){
      return '<button class="pill" data-action="go-' + v + '" aria-current="' + (activeView === v) + '">' + text + '</button>';
    }
    return (
      '<div class="shell">' +
        '<div class="topbar">' +
          '<div class="wordmark" data-action="go-home" role="button" tabindex="0" aria-label="Connecting Wall home">' +
            '<span class="brick-icon" aria-hidden="true">&#129530;</span>' +
            '<h1>Connecting Wall</h1>' +
            '<span class="tag">build &middot; share &middot; solve</span>' +
          '</div>' +
          '<nav class="pills">' + pill("home", "Home") + pill("build", "Build") + pill("library", "My Walls") + pill("learned", "Learning") + '</nav>' +
        '</div>' +
        '<div id="view-slot">' + inner + '</div>' +
      '</div>'
    );
  }

  /* ---------------- main render dispatcher ---------------- */
  function render(){
    var root = app();
    var inner = "";
    if (view === "home") inner = renderHome();
    else if (view === "build") inner = renderBuild();
    else if (view === "library") inner = renderLibrary();
    else if (view === "learned") inner = renderLearned();
    else if (view === "play") inner = renderPlay();
    root.innerHTML = shellHtml(view, inner);
    if (view === "play") renderPlayBody();
  }

  /* ---------------- event delegation ---------------- */
  document.addEventListener("click", function(e){
    var tile = e.target.closest(".tile");
    if (tile && view === "play" && play && !play.finished){
      toggleTile(parseInt(tile.getAttribute("data-idx"), 10));
      return;
    }

    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");

    if (action === "play-random"){
      currentWall = generateWall(t.getAttribute("data-diff") || "mixed");
      startPlay(currentWall);
    } else if (action === "go-build"){
      draftGroups = emptyDraftGroups();
      draftTitle = "";
      go("build");
    } else if (action === "go-library"){
      go("library");
    } else if (action === "set-timer"){
      timerMode = t.getAttribute("data-mode");
      try { localStorage.setItem("cw_timer_mode", timerMode); } catch (e){}
      go("home");
    } else if (action === "go-home"){
      go("home");
      maybeFlushStats();
    } else if (action === "go-learned"){
      go("learned");
    } else if (action === "open-code"){
      var input = document.getElementById("code-input");
      openCodeInput(input ? input.value : "");
    } else if (action === "fill-example"){
      syncDraftFromDom();
      draftGroups = TIER_COLORS.map(function(_, tier){
        var pool = categoriesByTier(tier);
        var c = pool[Math.floor(Math.random() * pool.length)];
        return { label: c.label, items: c.items.slice() };
      });
      go("build");
    } else if (action === "fill-row"){
      syncDraftFromDom();
      var rowIdx = parseInt(t.getAttribute("data-row"), 10);
      var rowPool = categoriesByTier(rowIdx);
      var picked = rowPool[Math.floor(Math.random() * rowPool.length)];
      draftGroups[rowIdx] = { label: picked.label, items: picked.items.slice() };
      go("build");
    } else if (action === "clear-build"){
      draftGroups = emptyDraftGroups();
      draftTitle = "";
      go("build");
    } else if (action === "preview-build"){
      var draft = readBuildForm();
      clearFieldErrors();
      var v = validateBuild(draft);
      if (v.errors.length){
        v.errors.forEach(function(er){ var n = $(er.sel); if (n) n.classList.add("field-error"); });
        toast("Fill in every field — sixteen items, four connections");
        return;
      }
      if (v.dupes){
        toast("Every item needs to be different");
        return;
      }
      var wall = {
        id: uid(),
        title: draft.title || "Untitled Wall",
        groups: draft.groups.map(function(g, gi){ return { label: g.label, color: TIER_COLORS[gi], tier: gi, items: g.items }; })
      };
      currentWall = wall;
      startPlay(wall);
    } else if (action === "shuffle-tiles"){
      play.pool = shuffle(play.pool);
      renderPlayBody();
    } else if (action === "deselect-tiles"){
      play.selected = [];
      renderPlayBody();
    } else if (action === "give-up"){
      finishPlay(false, "gaveup");
    } else if (action === "use-hint"){
      useHint();
    } else if (action === "save-wall"){
      addToLibrary(currentWall);
    } else if (action === "share-wall"){
      showShareModal(currentWall);
    } else if (action === "share-saved"){
      var id = t.getAttribute("data-id");
      var w = library.filter(function(x){ return x.id === id; })[0];
      if (w) showShareModal(w);
    } else if (action === "play-wall"){
      var id2 = t.getAttribute("data-id");
      var w2 = library.filter(function(x){ return x.id === id2; })[0];
      if (w2){ currentWall = w2; startPlay(w2); }
    } else if (action === "delete-wall"){
      var id3 = t.getAttribute("data-id");
      removeFromLibrary(id3);
    } else if (action === "close-modal"){
      closeModal();
    } else if (action === "copy-link"){
      var field = document.getElementById("share-link-field");
      if (field){
        field.select();
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(field.value).then(function(){ toast("Link copied"); }).catch(function(){
            document.execCommand && document.execCommand("copy");
            toast("Link copied");
          });
        } else {
          try { document.execCommand("copy"); toast("Link copied"); } catch (e){ toast("Select the link and copy it"); }
        }
      }
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeModal();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]')){
      e.preventDefault();
      e.target.click();
    }
  });

  /* ---------------- boot ---------------- */
  function boot(){
    initLibrary();
    initStats();
    if (BACKEND){
      storageMode = "http";
      loadRemoteState();
    } else if (window.claude && typeof window.claude.use === "function"){
      storageMode = "artifact";
      window.claude.use("artifact").then(function(cap){ artifactCap = cap; }).catch(function(){ artifactCap = null; });
    }
    if (!tryLoadFromHash()){
      go("home");
    }
    try {
      var pending = sessionStorage.getItem("cw_pending_toast");
      if (pending){
        sessionStorage.removeItem("cw_pending_toast");
        setTimeout(function(){ toast(pending); }, 300);
      }
    } catch (e){}
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
